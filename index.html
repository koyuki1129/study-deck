<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Study Deck | 反復学習ツール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">S</span><div><strong>Study Deck</strong><small>反復学習ツール</small></div></div>
      <button class="menu-button" id="menuToggle" aria-label="メニュー">☰</button>
    </header>
    <div class="layout">
      <nav class="sidebar" id="sidebar" aria-label="メインメニュー">
        <button class="nav-item active" data-view="home"><span>⌂</span>ホーム</button>
        <button class="nav-item" data-view="cards"><span>▤</span>カード管理</button>
        <button class="nav-item" data-view="sheets"><span>▣</span>学習シート</button>
        <button class="nav-item" data-view="history"><span>▥</span>学習履歴</button>
        <button class="nav-item" data-view="data"><span>⚙</span>データ管理</button>
        <div class="sidebar-note">データはこのブラウザ内に保存されます。</div>
      </nav>
      <main id="mainContent" class="main-content" tabindex="-1"></main>
    </div>
    <footer>Study Deck <span>Version 0.1 · 開発中</span></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
